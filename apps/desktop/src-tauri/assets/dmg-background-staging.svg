<!--
  DMG installer window art.

  Canvas is 1320x800px for a 660x400pt window, so 1pt = 2px, and the PNG must
  carry 144dpi or Finder rescales it and leaves the window edges bare.

  Finder draws the icons on top at 128pt: Notiz centred on (354,400)px and
  Applications on (966,400)px, each filling y 272..528 with its label to
  y~570. Everything here stays above, below, or in the gap between them.
-->
