    <linearGradient id="paper" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="800">
      <stop offset="0" stop-color="#F2F5FA"/>
      <stop offset="0.55" stop-color="#E4EBF4"/>
      <stop offset="1" stop-color="#D8E2EF"/>
    </linearGradient>
  </defs>

  <rect width="1320" height="800" fill="url(#paper)"/>

