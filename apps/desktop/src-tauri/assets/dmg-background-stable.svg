<!--
  DMG installer window art.

  Canvas is 1320x800px for a 660x400pt window, so 1pt = 2px, and the PNG must
  carry 144dpi or Finder rescales it and leaves the window edges bare.

  Finder draws the icons on top at 128pt: Skald centred on (354,400)px and
  Applications on (966,400)px, each filling y 272..528 with its label to
  y~570. Everything here stays above, below, or in the gap between them.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800">
  <defs>
    <linearGradient id="parchment" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="800">
      <stop offset="0" stop-color="#FDF8EF"/>
      <stop offset="0.55" stop-color="#F6ECDA"/>
      <stop offset="1" stop-color="#EFE2CA"/>
    </linearGradient>
  </defs>

  <rect width="1320" height="800" fill="url(#parchment)"/>

  <g transform="translate(512,44) scale(0.109)">
    <g fill="none" stroke="#3A342C" stroke-width="84"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M320 232 L320 792"/>
      <path d="M320 372 L660 232"/>
      <path d="M320 512 L600 512"/>
      <path d="M320 652 L660 792"/>
    </g>
  </g>
  <text x="604" y="120" fill="#3A342C"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="68" font-weight="500" letter-spacing="0.5">Skald</text>

  <text x="660" y="196" fill="#A29071" fill-opacity="0.75" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="400" letter-spacing="3">MEETING NOTES YOU OWN</text>

  <g stroke="#C9B48C" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M516 400 L772 400" stroke-dasharray="24 20"/>
  </g>
  <path d="M778 382 L814 400 L778 418 Z" fill="#C9B48C"/>

  <text x="660" y="672" fill="#8C7B5E" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="400">Drag Skald into your Applications folder</text>
</svg>
