<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800">
  <defs>
    <linearGradient id="parch" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="800">
      <stop offset="0" stop-color="#FCF6EB"/>
      <stop offset="1" stop-color="#F2E7D1"/>
    </linearGradient>
  </defs>

  <rect width="1320" height="800" fill="url(#parch)"/>

  <!-- wordmark lockup: rune stave + name -->
  <g transform="translate(472,41) scale(0.125)">
    <g fill="none" stroke="#3A342C" stroke-width="84"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M320 232 L320 792"/>
      <path d="M320 372 L660 232"/>
      <path d="M320 512 L600 512"/>
      <path d="M320 652 L660 792"/>
    </g>
  </g>
  <text x="578" y="130" fill="#3A342C"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="78" font-weight="500" letter-spacing="1">Skald</text>

  <!-- drag path between the app icon and the Applications alias -->
  <g stroke="#C3AE86" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M472 372 L800 372" stroke-dasharray="26 22"/>
  </g>
  <path d="M806 352 L846 372 L806 392 Z" fill="#C3AE86"/>

  <text x="660" y="600" fill="#8C7B5E" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="400">Drag Skald into Applications to install</text>

  <text x="660" y="742" fill="#B6A484" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400">© 2026 Skald</text>
</svg>
