[package]
name = "owhisper-client"
version = "0.0.1"
edition = "2024"

[features]
default = []
local = ["notiz-audio-utils"]

[dependencies]
notiz-am = { workspace = true }
notiz-audio-utils = { workspace = true, optional = true }
notiz-language = { workspace = true }
notiz-observability = { workspace = true }
notiz-ws-client = { workspace = true }
soniox = { workspace = true }

openai-transcription = { workspace = true }
owhisper-interface = { workspace = true }

futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }
reqwest-middleware = { workspace = true, features = ["json", "multipart"] }
reqwest-tracing = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-stream = { workspace = true }

backon = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
notiz-audio-utils = { workspace = true }
notiz-data = { workspace = true }

deepgram = { workspace = true, features = ["listen"] }
rodio = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing-subscriber = { workspace = true }
