[package]
name = "transcribe-whisper-local"
version = "0.1.0"
edition = "2024"

[features]
default = []
coreml = ["notiz-whisper-local/coreml"]
directml = ["notiz-pyannote-local/directml"]
cuda = ["notiz-whisper-local/cuda"]
hipblas = ["notiz-whisper-local/hipblas"]
openblas = ["notiz-whisper-local/openblas"]
metal = ["notiz-whisper-local/metal"]
vulkan = ["notiz-whisper-local/vulkan"]
openmp = ["notiz-whisper-local/openmp"]
[dev-dependencies]
bytes = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
notiz-data = { workspace = true }
owhisper-client = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
tokio-tungstenite = { workspace = true }

[dependencies]
notiz-audio-chunking = { workspace = true }
notiz-audio-interface = { workspace = true }
notiz-audio-utils = { workspace = true }
notiz-model-manager = { workspace = true, features = ["whisper-local"] }
notiz-pyannote-local = { workspace = true }
notiz-transcribe-core = { workspace = true }
notiz-whisper = { workspace = true }
notiz-whisper-local = { workspace = true }
notiz-ws-utils = { workspace = true }
owhisper-interface = { workspace = true }

bytes = { workspace = true }
serde_html_form = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

rodio = { workspace = true }
