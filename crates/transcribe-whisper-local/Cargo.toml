[package]
name = "transcribe-whisper-local"
version = "0.1.0"
edition = "2024"

[features]
default = []
coreml = ["skald-whisper-local/coreml"]
directml = ["skald-pyannote-local/directml"]
cuda = ["skald-whisper-local/cuda"]
hipblas = ["skald-whisper-local/hipblas"]
openblas = ["skald-whisper-local/openblas"]
metal = ["skald-whisper-local/metal"]
vulkan = ["skald-whisper-local/vulkan"]
openmp = ["skald-whisper-local/openmp"]
[dev-dependencies]
bytes = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
owhisper-client = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
skald-data = { workspace = true }
tokio-tungstenite = { workspace = true }

[dependencies]
owhisper-interface = { workspace = true }
skald-audio-chunking = { workspace = true }
skald-audio-interface = { workspace = true }
skald-audio-utils = { workspace = true }
skald-model-manager = { workspace = true, features = ["whisper-local"] }
skald-pyannote-local = { workspace = true }
skald-transcribe-core = { workspace = true }
skald-whisper = { workspace = true }
skald-whisper-local = { workspace = true }
skald-ws-utils = { workspace = true }

bytes = { workspace = true }
serde_html_form = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

rodio = { workspace = true }
