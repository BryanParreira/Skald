[package]
name = "calendar"
version = "0.1.0"
edition = "2024"

[features]
specta = ["dep:specta"]

[dependencies]
skald-api-client = { workspace = true }
skald-apple-calendar = { workspace = true, features = ["specta"] }
skald-calendar-interface = { workspace = true }
skald-google-calendar = { workspace = true, features = ["specta"] }
skald-outlook-calendar = { workspace = true, features = ["specta"] }

chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["chrono"], optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
