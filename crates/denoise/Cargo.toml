[package]
name = "denoise"
version = "0.1.0"
edition = "2024"

[features]
default = []
onnx = ["dep:skald-onnx", "dep:realfft"]
coreml = ["onnx", "skald-onnx/coreml"]

[dependencies]
realfft = { workspace = true, optional = true }
serde = { workspace = true }
skald-onnx = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
dasp = { workspace = true }
hound = { workspace = true }
rodio = { workspace = true }
skald-audio-snapshot = { workspace = true }
skald-data = { workspace = true }

[[bench]]
name = "denoise_bench"
harness = false
required-features = ["onnx"]
