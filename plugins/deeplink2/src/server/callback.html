<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notiz</title>
    <script src="https://cdn.twind.style" crossorigin></script>
  </head>
  <body
    class="flex min-h-screen items-center justify-center bg-gradient-to-b from-white via-stone-50 to-white p-6"
  >
    <div class="flex w-full max-w-md flex-col gap-8 text-center">
      <div class="flex flex-col gap-3">
        <h1 class="font-sans text-3xl tracking-tight text-stone-700">
          {{ title }}
        </h1>
        <p class="text-neutral-600">{{ description }}</p>
      </div>
      {% if is_success %}
      <a
        href="{{ deeplink_url }}"
        class="flex h-12 w-full cursor-pointer items-center justify-center rounded-full bg-gradient-to-t from-stone-600 to-stone-500 text-base font-medium text-white shadow-md transition-all hover:shadow-lg"
      >
        Open Notiz
      </a>
      {% endif %}
    </div>
  </body>
</html>
