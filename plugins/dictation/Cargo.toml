[package]
name = "tauri-plugin-dictation"
version = "0.1.0"
edition = "2024"
exclude = ["/js", "/node_modules"]
links = "tauri-plugin-dictation"

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
specta-typescript = { workspace = true }

[dependencies]
bytes = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }

tauri = { workspace = true, features = ["test"] }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-local-llm = { workspace = true }
tauri-plugin-settings = { workspace = true }
tauri-plugin-shortcut = { workspace = true }

owhisper-client = { workspace = true }
owhisper-interface = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
notiz-am = { workspace = true }
notiz-audio-actual = { workspace = true }
notiz-audio-utils = { workspace = true }
notiz-dictation-ui-macos = { workspace = true }
notiz-language = { workspace = true }
notiz-resampler = { workspace = true }
notiz-text-inject-macos = { workspace = true }
notiz-transcribe-soniqo = { workspace = true }
notiz-whisper-local-model = { workspace = true }
tauri-plugin-local-stt = { workspace = true, features = ["whisper-cpp"] }
